# http://plotadvisor.local -> panel (frontend en 127.0.0.1:3001). Icinga Web sigue en /icingaweb2.
# El WebSocket del monitor va directo al backend (127.0.0.1:8000/ws/...).
<VirtualHost *:80>
    ServerName plotadvisor.local

    ProxyPreserveHost On
    ProxyPass /icingaweb2 !
    ProxyPass        /api/ws/ ws://127.0.0.1:8000/ws/
    ProxyPassReverse /api/ws/ ws://127.0.0.1:8000/ws/
    ProxyPass        /        http://127.0.0.1:3001/
    ProxyPassReverse /        http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/plotadvisor-error.log
    CustomLog ${APACHE_LOG_DIR}/plotadvisor-access.log combined
</VirtualHost>
