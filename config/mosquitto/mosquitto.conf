# Broker MQTT de las balizas ESP32 (mismo comportamiento que en la Raspberry).
# Siempre con usuario: el fichero de contraseñas y la ACL los crea entrypoint.sh a partir de las variables del compose.
per_listener_settings false
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
