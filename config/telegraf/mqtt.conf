# fieldshift — métricas del broker MQTT -> InfluxDB bucket "mqtt" (30 días).
# Va en /etc/telegraf/telegraf.d/fieldshift-mqtt.conf (copia en /Users/gabriel/nasa/telegraf/).
# No toca el pipeline de las balizas (fieldshift.conf): measurements y salida propios, filtrados con namepass.
# Quitar: borrar este fichero y reiniciar telegraf.
# Nota: "$$SYS" = "$SYS" (Telegraf sustituye $VAR por variables de entorno; $$ lo escapa).

# 1) Estadísticas del propio Mosquitto (publica en $SYS cada 10 s). Requiere en /etc/mosquitto/acl:
#    user telegraf / topic read $SYS/#
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = [
    "$$SYS/broker/clients/connected",
    "$$SYS/broker/clients/disconnected",
    "$$SYS/broker/clients/maximum",
    "$$SYS/broker/clients/total",
    "$$SYS/broker/clients/expired",
    "$$SYS/broker/subscriptions/count",
    "$$SYS/broker/retained messages/count",
    "$$SYS/broker/store/messages/count",
    "$$SYS/broker/messages/received",
    "$$SYS/broker/messages/sent",
    "$$SYS/broker/publish/messages/received",
    "$$SYS/broker/publish/messages/sent",
    "$$SYS/broker/publish/messages/dropped",
    "$$SYS/broker/bytes/received",
    "$$SYS/broker/bytes/sent",
    "$$SYS/broker/load/messages/received/1min",
    "$$SYS/broker/load/messages/sent/1min",
    "$$SYS/broker/load/publish/dropped/1min",
    "$$SYS/broker/load/connections/1min",
    "$$SYS/broker/heap/current",
  ]
  client_id = "telegraf-fieldshift-sys"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 0
  topic_tag = "metrica"
  name_override = "mosquitto"
  data_format = "value"
  data_type = "float"

# "$SYS/broker/clients/connected" -> "clients/connected"
[[processors.strings]]
  namepass = ["mosquitto"]
  [[processors.strings.trim_prefix]]
    tag = "metrica"
    prefix = "$$SYS/broker/"

# 2) Tráfico por topic: cuenta TODOS los mensajes de fieldshift/#, también los que luego rechaza
#    el pipeline de las balizas (p. ej. b03/suelo sin "zona"). Solo guarda recuento y bytes, no el contenido.
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["fieldshift/#", "plot-advisor/#"]
  client_id = "telegraf-fieldshift-trafico"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 0
  topic_tag = "topic"
  name_override = "mqtt_topic"
  data_format = "value"
  data_type = "string"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/+/+"
    tags = "_/cliente/dispositivo/tipo"

[[processors.starlark]]
  namepass = ["mqtt_topic"]
  source = '''
def apply(metric):
    # Telegraf vuelve a pasar los procesadores tras el agregador: solo tocar los mensajes originales
    if "value" not in metric.fields:
        return metric
    v = metric.fields["value"]
    metric.fields.clear()
    metric.fields["mensajes"] = 1
    metric.fields["bytes"] = len(v)
    return metric
'''

# Una fila por topic y minuto: mensajes_sum = nº de mensajes, bytes_sum = bytes
[[aggregators.basicstats]]
  namepass = ["mqtt_topic"]
  period = "60s"
  drop_original = true
  stats = ["sum"]

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "fieldshift"
  bucket = "mqtt"
  namepass = ["mosquitto", "mqtt_topic"]
