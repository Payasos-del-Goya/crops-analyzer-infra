# fieldshift-gw — MQTT (Mosquitto) -> InfluxDB 2. Formato: FORMATO_DATOS.md del repo esp32_baliza.
# Sin hora en el mensaje: se usa la hora de llegada.

# ---- suelo -> measurement suelo ----
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["fieldshift/c001/+/suelo", "plot-advisor/c001/+/suelo"]
  client_id = "telegraf-fieldshift-suelo"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 0
  topic_tag = ""
  name_override = "suelo"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "finca"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "zona"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "dispositivo"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "tipo"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "profundidad_cm"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "humedad_vol"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "conductividad"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperatura"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ph"
      type = "float"
      optional = true

# ---- atmosfera -> measurement atmosfera ----
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["fieldshift/c001/+/atmosfera", "plot-advisor/c001/+/atmosfera"]
  client_id = "telegraf-fieldshift-atmosfera"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 0
  topic_tag = ""
  name_override = "atmosfera"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "finca"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "dispositivo"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "simulado"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temp_aire"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hr"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temp_helada"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temp_cubierta"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "lluvia_mm"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hoja_mojada_min"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "luz_lux"
      type = "float"
      optional = true

# ---- estado -> measurement dispositivo ----
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["fieldshift/c001/+/estado", "plot-advisor/c001/+/estado"]
  client_id = "telegraf-fieldshift-estado"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 0
  topic_tag = ""
  name_override = "dispositivo"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "finca"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "dispositivo"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "tipo"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bateria_v"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rssi"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "snr"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "seq"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sensores_ok"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gateway"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "heap_libre"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "heap_bloque"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime_s"
      type = "int"
      optional = true

# ---- Salidas: token de Telegraf (solo escritura en c001_*) ----
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TELEGRAF_TOKEN}"
  organization = "fieldshift"
  bucket = "c001_campo"
  namepass = ["suelo", "atmosfera"]

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TELEGRAF_TOKEN}"
  organization = "fieldshift"
  bucket = "c001_estado"
  namepass = ["dispositivo"]
